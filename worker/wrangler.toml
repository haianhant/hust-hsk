name = "hust-hsk-rooms"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ENVIRONMENT = "production"
ENABLE_PRODUCTION_BETA_EXPANSIONS = "1"
BETA_ALLOWED_RULESETS = "expansion-1,expansion-2,full-expansion"

[durable_objects]
bindings = [
  { name = "HSK_ROOM", class_name = "HskRoom" },
  { name = "BOARD_GAME_ROOM", class_name = "BoardGameRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HskRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BoardGameRoom"]

[env.staging]
name = "hust-hsk-rooms-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
ENABLE_PRODUCTION_BETA_EXPANSIONS = "1"
BETA_ALLOWED_RULESETS = "expansion-1,expansion-2,full-expansion"

[[env.staging.durable_objects.bindings]]
name = "HSK_ROOM"
class_name = "HskRoom"

[[env.staging.durable_objects.bindings]]
name = "BOARD_GAME_ROOM"
class_name = "BoardGameRoom"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["HskRoom"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["BoardGameRoom"]
