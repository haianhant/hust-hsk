name = "hust-hsk-rooms"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[durable_objects]
bindings = [
  { name = "HSK_ROOM", class_name = "HskRoom" },
  { name = "BOARD_GAME_ROOM", class_name = "BoardGameRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HskRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BoardGameRoom"]
