name: CI Verification Gates

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  build-and-unit:
    name: Gates 1–6 — Typecheck, Unit/Protocol/Sim & Static Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Gate 1 — TypeScript Typecheck (Frontend + Worker + Shared Contracts)
        run: npm run typecheck

      - name: Gate 2 — HSK & SRS Learning Engine Unit Tests
        run: npm run test:learn

      - name: Gate 3 — Shared Contracts, Bounds & DO Hibernation Unit Tests
        run: npm run test:contracts

      - name: Gate 3b — Campus World Data, Avatar, UI/Gameplay & Study/Social Module Unit Tests
        run: npm run test:world && npm run test:avatar && npm run test:ui && npm run test:study

      - name: Gate 4 — Campus Navigation & Collision Simulation
        run: npm run test:nav

      - name: Gate 5 — Multiplayer WebSocket Protocol Tests
        run: npm run test:mp

      - name: Gate 5b — Board Game Club & Bóng Đêm KTX Tests + Balance Sim
        run: npm run test:boardgame

      - name: Gate 6 — Next.js Static Export Build
        run: npm run build

      - name: Upload Next Static Export Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-static-out
          path: out/
          include-hidden-files: true
          retention-days: 1

  gate7-pr10b:
    name: Gate 7 — PR10B Browser Verification Gate
    needs: build-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Next Static Export Artifact
        uses: actions/download-artifact@v4
        with:
          name: next-static-out
          path: out

      - name: Verify Static Export Present
        run: test -f out/index.html

      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Gate 7 — PR10B Browser Verification Gate (No Silent Skip)
        run: PLAYWRIGHT_CORE_PATH=$(pwd)/node_modules/playwright-core npm run test:pr10b

  gate8-boardgame-e2e:
    name: Gate 8 — Board Game E2E (${{ matrix.shard }})
    needs: build-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [e2e-01-04, e2e-02, e2e-03, e2e-05-06, bg1-smoke]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Next Static Export Artifact
        uses: actions/download-artifact@v4
        with:
          name: next-static-out
          path: out

      - name: Verify Static Export Present
        run: test -f out/index.html

      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Gate 8 — Run Shard ${{ matrix.shard }}
        run: |
          if [ "${{ matrix.shard }}" = "bg1-smoke" ]; then
            node test/boardgame-bg1-smoke.cjs
          else
            node test/boardgame-e2e.cjs --shard=${{ matrix.shard }}
          fi

      - name: Upload Board Game E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boardgame-e2e-${{ matrix.shard }}
          path: test-results/boardgame/
          if-no-files-found: ignore
          retention-days: 7

  deploy-worker:
    name: Deploy Cloudflare Worker (hust-hsk-rooms)
    needs: [build-and-unit, gate7-pr10b, gate8-boardgame-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Cloudflare Worker (hust-hsk-rooms)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '692d45feec834c9219a6e331393bbc5c' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not configured in GitHub Actions Secrets."
            exit 1
          fi
          node scripts/deploy-ci.mjs
          curl -fsS https://hust-hsk-rooms.hunganhz179.workers.dev/health
          echo ""
          curl -fsS https://hust-hsk-rooms.hunganhz179.workers.dev/api/boardgame/health
          echo ""
          curl -fsS https://hust-hsk-rooms.hunganhz179.workers.dev/api/boardgame/matches
          echo ""
